[project]
name = "speech-foundation"
version = "0.1.0"
description = "Codec-LM based TTS"
requires-python = ">=3.10"

[tool.pytest.ini_options]
markers = ["network: tests that download model weights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
